# Site identity. Change only the text between the quotes.
name: "Biology Seminar Series"
year: "2026–2027"
intro: "A weekly seminar bringing researchers from across the life sciences to share new work with students, postdocs, and faculty. All are welcome."
when: "Mondays, 3:00–4:00 PM"
# Default start and end time of a talk, 24-hour "HH:MM" in quotes. Used on
# the flyers and in the calendar feed; a talk can override them with
# start: and end:.
start: "15:00"
end: "16:00"
where: "Example University"
contact: "seminar@example.edu"
# Default Zoom link for every talk; leave "" for none. A talk can use its
# own with zoom:, or zoom: false to show no link.
zoom: ""

# Set to false to hide the weekly flyer panel on the home page.
flyer_show: true

# Printable flyers (flyers/<talk-file>.html). The banner reads
# "<flyer_series> | <semester>"; the logo sits in the top-right corner.
flyer_series: "Biology Colloquium Series"
flyer_logo: images/flyer-logo.png
